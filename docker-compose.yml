name: bridgecore

services:
  postgres:
    image: postgres:16-alpine
    container_name: bridgecore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-bridgecore}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bridgecore}
      POSTGRES_DB: ${DB_NAME:-bridgecore}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - bridgecore_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bridgecore} -d ${DB_NAME:-bridgecore}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bridgecore-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${APP_VERSION:-0.1.0-dev}
        BUILD_TIME: ${APP_BUILD_TIME:-unknown}
    container_name: bridgecore-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: ${APP_PORT:-8080}
      APP_VERSION: ${APP_VERSION:-0.1.0-dev}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-bridgecore}
      DB_PASSWORD: ${DB_PASSWORD:-bridgecore}
      DB_NAME: ${DB_NAME:-bridgecore}
      DB_SSLMODE: disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me}
      API_KEY_PREFIX: ${API_KEY_PREFIX:-bc_live_}
      RATE_LIMIT_RPM: ${RATE_LIMIT_RPM:-120}
    ports:
     - "${APP_PORT:-8080}:${APP_PORT:-8080}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${APP_PORT:-8080}/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  seed:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bridgecore-seed
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-bridgecore}
      DB_PASSWORD: ${DB_PASSWORD:-bridgecore}
      DB_NAME: ${DB_NAME:-bridgecore}
      DB_SSLMODE: disable
    entrypoint: ["/app/bridgecore-seed"]
    restart: "no"

volumes:
  bridgecore_postgres_data:
