openapi: 3.0.3
info:
  title: BridgeCore Platform API
  description: >
    BridgeCore is a reusable multi-tenant backend platform providing
    authentication, authorization, feature entitlements, API keys, usage
    metering, and audit logging as REST APIs for downstream products.
  version: "0.1.0"
  contact:
    name: BridgeCore Platform Team
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: auth
  - name: tenants
    description: >
      The caller's own tenant only. Any other tenant id returns 404 rather than
      403, so this API cannot be used to discover which tenant ids exist.
  - name: users
  - name: entitlements
  - name: apikeys
  - name: usage
  - name: audit
  - name: platform
    description: >
      Cross-tenant control plane. Authenticated with the X-Platform-Token
      operator credential, never with a customer JWT — no tenant credential,
      however privileged inside its own tenant, can reach these operations.
      Returns 404 when the token is absent or wrong, so the control plane does
      not advertise its own existence.
  - name: graphql
  - name: health

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    PlatformToken:
      type: apiKey
      in: header
      name: X-Platform-Token
      description: >
        Platform operator credential for the cross-tenant control plane.
        Compared in constant time. Deliberately not derivable from any
        customer login.
  schemas:
    Envelope:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data: {}
        error: {}
    Tenant:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        plan: { type: string, enum: [free, pro, enterprise] }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        email: { type: string, format: email }
        first_name: { type: string }
        last_name: { type: string }
        role: { type: string, enum: [admin, developer, viewer] }
        is_active: { type: boolean }
    TokenPair:
      type: object
      properties:
        access_token: { type: string }
        access_token_expires_at: { type: string, format: date-time }
        refresh_token: { type: string }
        refresh_token_expires_at: { type: string, format: date-time }
    APIKey:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string }
        last_four: { type: string }
        is_active: { type: boolean }
    UsageLog:
      type: object
      properties:
        id: { type: string, format: uuid }
        endpoint: { type: string }
        method: { type: string }
        status_code: { type: integer }
        latency_ms: { type: integer }
        created_at: { type: string, format: date-time }
    AuditLog:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        actor_id: { type: string, format: uuid }
        event: { type: string }
        metadata: { type: object }
        endpoint: { type: string }
        ip_address: { type: string }
        user_agent: { type: string }
        created_at: { type: string, format: date-time }

paths:
  /health:
    get:
      tags: [health]
      summary: Full health report
      responses:
        "200": { description: Healthy }
        "503": { description: Degraded }
  /ready:
    get:
      tags: [health]
      summary: Readiness probe
      responses:
        "200": { description: Ready }
        "503": { description: Not ready }
  /live:
    get:
      tags: [health]
      summary: Liveness probe
      responses:
        "200": { description: Alive }

  /api/v1/auth/signup:
    post:
      tags: [auth]
      summary: Register a new tenant and admin user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_name, email, password]
              properties:
                tenant_name: { type: string }
                email: { type: string }
                password: { type: string, minLength: 8 }
                first_name: { type: string }
                last_name: { type: string }
      responses:
        "201": { description: Created }
        "400": { description: Bad request }
        "409": { description: Email or slug already taken }

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200": { description: OK }
        "401": { description: Invalid credentials }

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: Exchange a refresh token for a new token pair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200": { description: OK }
        "401": { description: Invalid or expired refresh token }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Revoke all refresh tokens for the current user
      security: [{ BearerAuth: [] }]
      responses:
        "200": { description: OK }

  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: Get the currently authenticated user
      security: [{ BearerAuth: [] }]
      responses:
        "200": { description: OK }

  /api/v1/tenant:
    get:
      tags: [tenants]
      summary: Get the authenticated caller's tenant
      security: [{ BearerAuth: [] }, { ApiKeyAuth: [] }]
      responses:
        "200": { description: OK }
    patch:
      tags: [tenants]
      summary: Update the caller's own tenant profile (admin only)
      description: >
        Only the display name is mutable. `plan` is absent by design: a tenant's
        plan determines its feature entitlements, so a tenant able to write its
        own plan could grant itself any feature. Plan changes are a platform
        operation.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
      responses:
        "200": { description: OK }
        "403": { description: Requires the admin role }

  /api/v1/tenants:
    get:
      tags: [tenants]
      summary: List tenants visible to the caller
      description: >
        Always returns exactly the caller's own tenant. Retained for API
        compatibility; prefer GET /api/v1/tenant.
      security: [{ BearerAuth: [] }, { ApiKeyAuth: [] }]
      responses:
        "200": { description: OK }

  /api/v1/tenants/{id}:
    get:
      tags: [tenants]
      summary: Get a tenant by id (only the caller's own resolves)
      description: >
        Any id other than the caller's own returns 404, not 403. A 403 would
        confirm that the resource exists, which is enough to enumerate other
        tenants' ids.
      security: [{ BearerAuth: [] }, { ApiKeyAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: OK }
        "404": { description: Not found, or belongs to another tenant }

  /api/v1/users:
    get:
      tags: [users]
      summary: List users in the current tenant
      security: [{ BearerAuth: [] }]
      responses:
        "200": { description: OK }

  /api/v1/users/me:
    get:
      tags: [users]
      summary: Get the authenticated user
      description: >
        Returns 400 for API-key credentials, which authenticate a tenant rather
        than a person.
      security: [{ BearerAuth: [] }]
      responses:
        "200": { description: OK }

  /api/v1/users/{id}:
    get:
      tags: [users]
      summary: Get one user in the caller's tenant
      security: [{ BearerAuth: [] }, { ApiKeyAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: OK }
        "404": { description: Not found, or belongs to another tenant }

  /api/v1/users/{id}/status:
    patch:
      tags: [users]
      summary: Activate or deactivate a user (admin only)
      description: >
        The last remaining admin of a tenant cannot be deactivated, which would
        leave the tenant unadministrable.
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_active]
              properties:
                is_active: { type: boolean }
      responses:
        "200": { description: OK }
        "403": { description: Requires the admin role }
        "409": { description: Would remove the last admin }

  /api/v1/users/{id}/role:
    patch:
      tags: [users]
      summary: Change a user's RBAC role (admin only)
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [admin, developer, viewer] }
      responses:
        "200": { description: OK }

  /api/v1/features:
    get:
      tags: [entitlements]
      summary: List the full feature catalog
      security: [{ BearerAuth: [] }]
      responses:
        "200": { description: OK }

  /api/v1/features/mine:
    get:
      tags: [entitlements]
      summary: List features enabled for the current tenant
      security: [{ BearerAuth: [] }]
      responses:
        "200": { description: OK }

  /api/v1/apikeys:
    post:
      tags: [apikeys]
      summary: Generate a new API key
      security: [{ BearerAuth: [] }]
      responses:
        "201": { description: Created }
    get:
      tags: [apikeys]
      summary: List API keys for the current tenant
      security: [{ BearerAuth: [] }]
      responses:
        "200": { description: OK }

  /api/v1/apikeys/{id}/rotate:
    post:
      tags: [apikeys]
      summary: Rotate an API key
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: OK }

  /api/v1/apikeys/{id}:
    delete:
      tags: [apikeys]
      summary: Deactivate (revoke) an API key
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: OK }

  /api/v1/usage:
    get:
      tags: [usage]
      summary: List raw usage records for the current tenant
      security: [{ BearerAuth: [], ApiKeyAuth: [] }]
      parameters:
        - in: query
          name: endpoint
          schema: { type: string }
        - in: query
          name: method
          schema: { type: string }
        - in: query
          name: from
          schema: { type: string, format: date-time }
        - in: query
          name: to
          schema: { type: string, format: date-time }
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: page_size
          schema: { type: integer }
      responses:
        "200": { description: OK }

  /api/v1/usage/summary:
    get:
      tags: [usage]
      summary: Get aggregated usage summary per endpoint
      security: [{ BearerAuth: [], ApiKeyAuth: [] }]
      responses:
        "200": { description: OK }

  /api/v1/usage/exports:
    post:
      tags: [usage]
      summary: Request an asynchronous usage export
      description: >
        Requires the "usage.export" feature entitlement (Pro/Enterprise),
        enforced by middleware before the handler runs. Returns 202 with a job
        you can poll — the previous synchronous CSV endpoint held a connection
        open while paging the whole usage table, which outlives the load
        balancer's idle timeout for a large tenant and repeats all the work on
        retry.
      security: [{ BearerAuth: [] }, { ApiKeyAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                endpoint: { type: string }
                method: { type: string }
                from: { type: string, format: date-time }
                to: { type: string, format: date-time }
      responses:
        "202": { description: Export queued }
        "403": { description: Plan does not include this feature }
    get:
      tags: [usage]
      summary: List the caller tenant's export jobs
      security: [{ BearerAuth: [] }, { ApiKeyAuth: [] }]
      parameters:
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: page_size
          schema: { type: integer }
      responses:
        "200": { description: OK }
        "403": { description: Plan does not include this feature }

  /api/v1/usage/exports/{id}:
    get:
      tags: [usage]
      summary: Get one export job, including a download URL when complete
      security: [{ BearerAuth: [] }, { ApiKeyAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: OK }
        "404": { description: Not found, or belongs to another tenant }

  /api/v1/usage/exports/{id}/download:
    get:
      tags: [usage]
      summary: Mint a short-lived download URL for a completed export
      description: >
        The URL is generated per request and never stored, so it always expires
        and a replayed old response is not a usable capability. With the S3
        backend this is a presigned URL and the bytes never pass through the
        API.
      security: [{ BearerAuth: [] }, { ApiKeyAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Download URL created }
        "409": { description: The export is not complete }

  /api/v1/usage/exports/download:
    get:
      tags: [usage]
      summary: Serve a signed export object (local object-store backend only)
      description: >
        Deliberately unauthenticated: the HMAC signature in the URL is the
        capability, exactly as with an S3 presigned URL, which is what lets a
        browser follow the link. The signature covers both the object key and
        the expiry, so neither can be edited to reach another tenant's export or
        to extend the window.
      parameters:
        - in: query
          name: key
          required: true
          schema: { type: string }
        - in: query
          name: expires
          required: true
          schema: { type: integer }
        - in: query
          name: signature
          required: true
          schema: { type: string }
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema: { type: string }
        "403": { description: Link expired or altered }

  /api/v1/audit:
    get:
      tags: [audit]
      summary: List audit log entries for the current tenant
      security: [{ BearerAuth: [] }]
      parameters:
        - in: query
          name: event
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: page_size
          schema: { type: integer }
      responses:
        "200": { description: OK }

  /api/v1/audit/{id}:
    get:
      tags: [audit]
      summary: Get a single audit log entry by ID
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: OK }
        "404": { description: Not found }

  /graphql:
    post:
      tags: [graphql]
      summary: Execute a GraphQL query or mutation
      description: >
        A second transport over the same service layer, not a second
        application: resolvers call the same services the REST handlers call and
        hold no database handle, so every tenancy guard, RBAC rule and
        entitlement check applies identically. The endpoint sits behind the same
        middleware chain as REST, so requests are authenticated, rate limited,
        metered and correlated the same way.


        Documents are analysed before execution and rejected on depth,
        complexity or size with the code QUERY_REJECTED. A variable page size is
        costed at the configured maximum, because the value is unknown until
        execution. The response carries X-GraphQL-Complexity.


        POST only: a query in a URL lands in access logs, proxy caches and
        browser history, and a mutation over GET is trivially CSRF-able.
        Errors appear in the errors array with HTTP 200 per the GraphQL
        specification, carrying the same stable codes as the REST envelope in
        extensions.code.


        The SDL contract is published under graph/schema/.
      security: [{ BearerAuth: [] }, { ApiKeyAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string }
                operationName: { type: string }
                variables: { type: object }
            example:
              query: "{ me { email role } tenant { name plan } }"
      responses:
        "200":
          description: >
            A GraphQL response. May contain data, errors, or both — a partial
            result is still a result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, nullable: true }
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        message: { type: string }
                        extensions:
                          type: object
                          properties:
                            code: { type: string }
                            status: { type: integer }
        "400": { description: Malformed request body, or a GET query attempt }
        "401": { description: Missing or invalid credential }
    get:
      tags: [graphql]
      summary: GraphiQL IDE (non-production only)
      description: >
        Served only when GRAPHQL_PLAYGROUND is enabled, which configuration
        validation forbids in production. Returns 404 otherwise.
      responses:
        "200":
          description: HTML IDE
          content:
            text/html:
              schema: { type: string }
        "404": { description: Playground disabled }

  /api/v1/platform/tenants:
    post:
      tags: [platform]
      summary: Provision a tenant
      security: [{ PlatformToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name: { type: string }
                slug: { type: string }
                plan: { type: string, enum: [free, pro, enterprise] }
      responses:
        "201": { description: Created }
        "404": { description: Missing or invalid operator token }
        "409": { description: Slug already taken }
    get:
      tags: [platform]
      summary: List every tenant on the platform
      security: [{ PlatformToken: [] }]
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: page_size
          schema: { type: integer }
      responses:
        "200": { description: OK }
        "404": { description: Missing or invalid operator token }

  /api/v1/platform/tenants/{id}:
    get:
      tags: [platform]
      summary: Get any tenant by id
      security: [{ PlatformToken: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: OK }
        "404": { description: Not found, or missing operator token }
    put:
      tags: [platform]
      summary: Update any tenant, including its plan
      description: >
        This is where plan changes live. A plan determines feature entitlements,
        so it is a billing operation rather than a tenant-editable field.
      security: [{ PlatformToken: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                plan: { type: string, enum: [free, pro, enterprise] }
                is_active:
                  type: boolean
                  description: >
                    Suspension takes effect on the tenant's next request, because
                    authentication re-reads the tenant row rather than trusting
                    the token.
      responses:
        "200": { description: OK }
        "404": { description: Not found, or missing operator token }
    delete:
      tags: [platform]
      summary: Soft-delete any tenant
      security: [{ PlatformToken: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: OK }
        "404": { description: Not found, or missing operator token }

  /api/v1/platform/features/grant:
    post:
      tags: [platform]
      summary: Grant or revoke a feature for any tenant
      description: >
        This endpoint previously accepted a tenant_id from any authenticated
        tenant admin, which allowed a tenant to grant itself Enterprise
        features. It now requires the platform operator token, so no customer
        credential can reach it. Audited as feature.granted / feature.revoked.
      security: [{ PlatformToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, feature_key, enabled]
              properties:
                tenant_id: { type: string }
                feature_key: { type: string }
                enabled: { type: boolean }
      responses:
        "200": { description: OK }
        "404": { description: Missing or invalid operator token }
